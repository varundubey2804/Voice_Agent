<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invite Connections | Professional Network</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <div class="flex items-center">
        <a href="index.html" class="nav-brand">
          <i class="fab fa-linkedin" style="font-size: 2rem;"></i>
        </a>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search">
        </div>
      </div>

      <div class="nav-links">
        <a href="index.html" class="nav-item">
          <i class="fas fa-home"></i>
          <span>Home</span>
        </a>
        <a href="connections.html" class="nav-item">
          <i class="fas fa-user-friends"></i>
          <span>My Network</span>
        </a>
        <a href="notifications.html" class="nav-item">
          <i class="fas fa-bell"></i>
          <span>Notifications</span>
          <span class="badge">3</span>
        </a>
        <a href="profile.html" class="nav-item">
          <img src="https://i.pravatar.cc/150?u=jane" alt="Profile" style="width: 24px; height: 24px; border-radius: 50%; margin-bottom: 2px;">
          <span>Me <i class="fas fa-caret-down"></i></span>
        </a>
        <button id="themeToggle" class="theme-toggle">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="auth-container" style="align-items: flex-start; padding-top: 40px;">
    <div class="card auth-card" style="max-width: 600px;">
      <h2 class="font-semibold text-lg mb-4 text-center">Expand your network</h2>
      <p class="text-center text-sm text-secondary mb-6">Invite your contacts to connect with you on NetworkIn. Enter their email address below.</p>

      <div class="input-group mb-4">
        <input type="email" class="input-field" placeholder="email@example.com" id="inviteEmail">
      </div>

      <button class="btn btn-primary w-full" style="width: 100%; padding: 12px; font-size: 1rem;" onclick="showToast('Invitation sent successfully!'); document.getElementById('inviteEmail').value='';">Send Invitation</button>

      <hr style="border: none; border-top: 1px solid var(--border-color); margin: 24px 0;">

      <h3 class="font-semibold text-md mb-4 text-center">Share your profile link</h3>
      <div class="flex gap-2">
        <input type="text" class="input-field flex-1" value="https://networkin.com/in/janedoe" readonly id="profileLink" style="flex:1;">
        <button class="btn btn-outline" onclick="navigator.clipboard.writeText(document.getElementById('profileLink').value); showToast('Link copied to clipboard!');">Copy Link</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
