<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Professional Network</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="auth-container">
    <div class="card auth-card">
      <div class="auth-header">
        <div class="auth-logo">NetworkIn</div>
        <p class="text-secondary">Make the most of your professional life</p>
      </div>

      <form onsubmit="handleAuth(event, 'Login')">
        <div class="input-group">
          <label class="input-label" for="email">Email</label>
          <input type="email" id="email" class="input-field" placeholder="Email or phone number" required>
        </div>

        <div class="input-group">
          <label class="input-label" for="password">Password</label>
          <input type="password" id="password" class="input-field" placeholder="Password" required>
        </div>

        <div class="mb-4 text-sm">
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-full" style="width: 100%; padding: 12px; font-size: 1rem;">Sign in</button>
      </form>

      <div class="auth-footer">
        <p>New to NetworkIn? <a href="signup.html" class="font-semibold">Join now</a></p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
