<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup | Professional Network</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="auth-container">
    <div class="card auth-card">
      <div class="auth-header">
        <div class="auth-logo">NetworkIn</div>
        <p class="text-secondary">Make the most of your professional life</p>
      </div>

      <form onsubmit="handleAuth(event, 'Signup')">
        <div class="input-group">
          <label class="input-label" for="name">Full Name</label>
          <input type="text" id="name" class="input-field" placeholder="First and last name" required>
        </div>

        <div class="input-group">
          <label class="input-label" for="email">Email</label>
          <input type="email" id="email" class="input-field" placeholder="Email" required>
        </div>

        <div class="input-group">
          <label class="input-label" for="password">Password (6+ characters)</label>
          <input type="password" id="password" class="input-field" placeholder="Password" minlength="6" required>
        </div>

        <p class="text-xs text-secondary mb-4 text-center">
          By clicking Agree & Join, you agree to the NetworkIn User Agreement, Privacy Policy, and Cookie Policy.
        </p>

        <button type="submit" class="btn btn-primary w-full" style="width: 100%; padding: 12px; font-size: 1rem;">Agree & Join</button>
      </form>

      <div class="auth-footer">
        <p>Already on NetworkIn? <a href="login.html" class="font-semibold">Sign in</a></p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
