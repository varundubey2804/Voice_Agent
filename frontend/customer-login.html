<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Veena AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap');
        
        * { font-family: 'Inter', sans-serif; }
        body { margin: 0; overflow: hidden; background: #030712; }
        
        .bg-animated {
            position: fixed; inset: 0; z-index: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(16, 185, 129, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(6, 182, 212, 0.1), transparent),
                linear-gradient(180deg, #030712 0%, #0a0f1a 50%, #030712 100%);
        }
        
        .bg-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image: 
                linear-gradient(rgba(16, 185, 129, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        
        .orb {
            position: fixed; border-radius: 50%; filter: blur(80px);
            animation: float 20s ease-in-out infinite; pointer-events: none;
        }
        .orb-1 { width: 400px; height: 400px; background: rgba(16, 185, 129, 0.15); top: -100px; right: -100px; }
        .orb-2 { width: 300px; height: 300px; background: rgba(6, 182, 212, 0.12); bottom: -50px; left: -50px; }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
        }
        
        .glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #10b981 0%, #06b6d4 50%, #8b5cf6 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .input-glow:focus {
            outline: none;
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2), 0 0 20px rgba(16, 185, 129, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .spinner {
            width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .particle {
            position: fixed; width: 2px; height: 2px;
            background: rgba(16, 185, 129, 0.5); border-radius: 50%;
            pointer-events: none; animation: particle-float 15s linear infinite;
        }
        @keyframes particle-float {
            0% { transform: translateY(100vh); opacity: 0; }
            10% { opacity: 1; } 90% { opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="bg-animated"></div>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div id="particles"></div>
    
    <div class="min-h-screen flex items-center justify-center p-6 relative z-10">
        <div class="glass rounded-3xl p-10 w-full max-w-md">
            
            <!-- Back Button -->
            <a href="login.html" class="inline-flex items-center text-gray-400 hover:text-white mb-8 transition-colors">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Back
            </a>
            
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500 to-cyan-500 mb-4 shadow-lg shadow-emerald-500/30">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-white mb-2">Customer Login</h1>
                <p class="text-gray-400">Access your financial dashboard</p>
            </div>
            
            <!-- Error Message -->
            <div id="error-message" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl mb-6 text-sm"></div>
            
            <!-- Success Message -->
            <div id="success-message" class="hidden bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-4 py-3 rounded-xl mb-6 text-sm"></div>
            
            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="w-full glass input-glow rounded-xl px-4 py-3 text-white placeholder-gray-500 bg-transparent border border-white/10"
                        placeholder="Enter your email"
                        required
                    >
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="w-full glass input-glow rounded-xl px-4 py-3 text-white placeholder-gray-500 bg-transparent border border-white/10"
                        placeholder="Enter your password"
                        required
                    >
                </div>
                
                <div class="flex items-center justify-between mb-6">
                    <label class="flex items-center text-sm text-gray-400">
                        <input type="checkbox" id="remember" class="mr-2 rounded bg-transparent border-gray-600">
                        Remember me
                    </label>
                    <a href="#" class="text-sm text-emerald-400 hover:text-emerald-300">Forgot password?</a>
                </div>
                
                <button type="submit" id="submit-btn" class="btn-primary w-full py-3 rounded-xl text-white font-semibold flex items-center justify-center">
                    <span id="btn-text">Sign In</span>
                    <div id="btn-spinner" class="spinner hidden ml-2"></div>
                </button>
            </form>
            
            <!-- Sign Up Link -->
            <div class="mt-8 text-center">
                <p class="text-gray-400">
                    Don't have an account? 
                    <a href="signup.html" class="text-emerald-400 hover:text-emerald-300 font-semibold">Sign Up</a>
                </p>
            </div>
        </div>
    </div>
    
    <script>
        // Generate particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 15; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particlesContainer.appendChild(particle);
        }
    </script>
    
    <!-- Supabase Client -->
    <script src="js/supabase-client.js"></script>
    
    <script>
        // Check if already logged in
        (async function() {
            const isAuth = await SupabaseAuth.isAuthenticated();
            if (isAuth) {
                const user = await SupabaseAuth.getCurrentUser();
                const profile = await SupabaseAuth.getProfile(user.id);
                
                if (profile.user_type === 'customer') {
                    window.location.href = 'index.html';
                } else {
                    window.location.href = 'agent-dashboard.html';
                }
            }
        })();
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');
            
            // Show loading
            submitBtn.disabled = true;
            btnText.textContent = 'Signing in...';
            btnSpinner.classList.remove('hidden');
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
            
            try {
                // Sign in with Supabase
                const { user, session } = await SupabaseAuth.signIn(email, password);
                
                // Get user profile
                const profile = await SupabaseAuth.getProfile(user.id);
                
                // Check if user is a customer
                if (profile.user_type !== 'customer') {
                    throw new Error('This login is for customers only. Please use Agent Login.');
                }
                
                // Store user data in localStorage for quick access
                localStorage.setItem('veena_user', JSON.stringify({
                    id: user.id,
                    email: user.email,
                    full_name: profile.full_name,
                    user_type: profile.user_type
                }));
                
                successMessage.textContent = 'Login successful! Redirecting...';
                successMessage.classList.remove('hidden');
                
                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
                
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = error.message || 'Login failed. Please check your credentials.';
                errorMessage.classList.remove('hidden');
                
                submitBtn.disabled = false;
                btnText.textContent = 'Sign In';
                btnSpinner.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
